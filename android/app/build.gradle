plugins {
    id 'com.android.application'
}

android {
    namespace "io.nava.videoplayer"

    compileSdkVersion 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "io.nava.videoplayer"
        // 28, not 26. AImageReader (the decode target, see
        // platform/android/codec/mediacodec_video.hh) is available from 26,
        // but AMEDIAFORMAT_KEY_COLOR_STANDARD/TRANSFER/RANGE arrived in 28 —
        // and telling the decoder what colour the content is is not optional
        // in this player, it is the entire point. Raising the floor is the
        // honest fix; guarding the keys behind a runtime check would leave
        // pre-28 devices decoding HDR as if it were BT.709.
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                // core/CMakeLists.txt gates its desktop test executables on
                // CMAKE_BUILD_TYPE=Debug. Those are host binaries with no
                // place in an APK, so the native side is Release regardless
                // of the Gradle variant.
                arguments "-DCMAKE_BUILD_TYPE=Release",
                          // -PVP_STATS=1 turns on the once-a-second playback
                          // statistics line. See android/CMakeLists.txt.
                          "-DVP_STATS=${project.hasProperty('VP_STATS') ? project.property('VP_STATS') : 'OFF'}",
                          // The Slang compiler. VceShaders.cmake defaults to a
                          // Windows Vulkan SDK path; on Linux the shader-slang
                          // package installs it here. Override on the command
                          // line if yours lives elsewhere.
                          "-DVCE_SLANGC=/opt/shader-slang/bin/slangc"
            }
        }
    }

    // AppShellActivity.java is app_shell's, and Gradle compiles it — its own
    // CMakeLists.txt cannot. Without this the JNI lookups fail and every
    // service activity_bridge.cc offers (HDR colour mode, content:// reads,
    // the soft keyboard) quietly becomes a no-op.
    sourceSets {
        main.java.srcDirs += '../../framework/app_shell/platform/android/java'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }
}

// android/CMakeLists.txt's vce_compile_slang() writes .spv files straight into
// app/src/main/assets/shaders/ as a side effect of the native build. AGP only
// tracks declared source-set inputs, so without this the asset-merge tasks run
// (and cache as up-to-date) before CMake has produced anything and the shaders
// silently never reach the APK.
afterEvaluate {
    def nativeBuildTasks = tasks.matching { it.name.startsWith("buildCMake") }
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
        dependsOn nativeBuildTasks
    }
}
